listen = "0.0.0.0:8011";

github {
  match ".*" {
    // harness probe target: per-repo program that logs exec to /shared
    cmd = "/usr/local/bin/prp.sh %e %o %r";
    // known template secret — probes sign with this to test the HMAC
    // gate end-to-end; unsigned/incorrectly-signed POSTs must be rejected
    secret = "crsknownsecret";
  }
}
