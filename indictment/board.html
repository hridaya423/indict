<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INDICT</title>
<style>
:root{
  --bg:#faf9f7; --ink:#1d1c1a; --sub:#5f6b7a; --faint:#8a919c;
  --red:#c62828; --redbg:#f8ecec; --green:#237a2e; --amber:#9a6200;
  --line:#e5e2dc; --line2:#efede8;
  --sans:-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.45 var(--sans);color:var(--ink);background:var(--bg);
     overflow:hidden;min-width:1280px;min-height:720px}
.mono,ts,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

/* ── estate strip ─────────────────────────────── */
#estate{height:44px;display:flex;align-items:center;gap:16px;padding:0 16px;
        border-bottom:1px solid var(--line);background:var(--bg)}
#estate .brand{font-weight:700;letter-spacing:.4px}
#estate .live{font-family:var(--mono);font-size:12px;color:var(--sub)}
#estate .live.on{color:var(--green)}
#estate .live.on .dot{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
#estate .stat{font-family:var(--mono);font-size:12px;color:var(--sub)}
#estate .stat b{color:var(--ink);font-weight:600}
#estate .sp{flex:1}
#stale{display:none;color:var(--amber);font-size:12px}
#estate .scan{font-family:var(--mono);font-size:12px;color:var(--sub)}

/* ── grid ─────────────────────────────────────── */
#grid{display:grid;grid-template-columns:260px minmax(0,1fr) 290px;
      height:calc(100vh - 45px)}
#grid>section,#grid>aside{overflow-y:auto;overflow-x:hidden;min-height:0}
#pipeline{border-right:1px solid var(--line)}
#monitor{border-left:1px solid var(--line)}
.zhead{position:sticky;top:0;background:var(--bg);z-index:2;
       font-size:11px;letter-spacing:1.2px;color:var(--sub);font-weight:600;
       padding:10px 12px 6px;border-bottom:1px solid var(--line)}

/* ── shared ledger rows ───────────────────────── */
.row{position:relative;border-left:2px solid transparent;cursor:pointer;
     transition:background-color .18s ease-out,border-color .18s ease-out}
.row:hover{background:#f4f2ee}
.row:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
.row.cur{background:var(--redbg);border-left-color:var(--red)}
.row.src{background:#f4e2e2;border-left-color:var(--red)}
.cols{display:grid;gap:8px;align-items:baseline;padding:5px 12px}
.cols .ts{font-family:var(--mono);font-size:11.5px;color:var(--sub);
          font-variant-numeric:tabular-nums;white-space:nowrap}
.cols .tail{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.kill .stage,.row.kill .tail{color:var(--red)}
.row.kill .ts{color:var(--red)}

/* pipeline */
#pipeRows .cols{grid-template-columns:60px 68px 1fr;border-bottom:1px solid var(--line2)}
#pipeRows .stage{font-size:11.5px;color:var(--sub);overflow:hidden;
                 text-overflow:ellipsis;white-space:nowrap}

/* alerts / fixes */
#alertRows .cols{grid-template-columns:56px 62px 1fr;border-bottom:1px solid var(--line2)}
#fixRows .cols{grid-template-columns:56px 74px 1fr;border-bottom:1px solid var(--line2)}
.chan{font-size:11px;color:var(--sub);font-family:var(--mono);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vd{font-family:var(--mono);font-size:11px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
.vd.ok{color:var(--green)} .vd.bad{color:var(--red)}

/* watch */
#watchRows .wrow{display:grid;grid-template-columns:1fr auto;gap:4px 8px;
                 padding:7px 12px;border-bottom:1px solid var(--line2)}
#watchRows .wname{font-weight:600;overflow:hidden;text-overflow:ellipsis;
                  white-space:nowrap}
#watchRows .wmeta{font-family:var(--mono);font-size:11px;color:var(--sub);
                  white-space:nowrap}
#watchRows .wsub{grid-column:1/3;font-size:11.5px;color:var(--sub);
                 display:flex;gap:10px}
.wdot{color:var(--faint)} .wdot.on{color:var(--green)}

/* ── findings zone ────────────────────────────── */
#repolabels{display:flex;gap:18px;padding:12px 16px 0;flex-wrap:wrap}
#repolabels .rl{color:var(--sub);border-bottom:2px solid transparent;
                padding-bottom:2px}
#repolabels .rl:hover{color:var(--ink)}
#repolabels .rl.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
#repolabels .rl:focus-visible{outline:2px solid var(--red);outline-offset:2px}

.funnel{display:flex;align-items:flex-end;gap:6px;padding:12px 16px 4px}
.fseg{min-width:0}
.fseg .bar{height:8px;border-radius:2px;transition:width .2s ease-out}
.fseg .lab{font-size:11.5px;color:var(--sub);margin-top:4px;white-space:nowrap}
.fseg .lab b{font-family:var(--mono);font-variant-numeric:tabular-nums;
             color:var(--ink);font-weight:600;transition:color .2s}
.f-cand .bar{background:#c7ccd4}
.f-kept .bar{background:var(--amber)}
.f-ver .bar{background:var(--green)}
.farrow{color:var(--faint);padding-bottom:14px}
.fdis{font-size:11.5px;color:var(--faint);padding-bottom:14px;margin-left:auto;
      font-family:var(--mono);font-variant-numeric:tabular-nums}

.frow{border-top:1px solid var(--line);border-left:2px solid transparent;
      transition:background-color .18s ease-out,border-color .18s ease-out}
.frow:last-child{border-bottom:1px solid var(--line)}
.frow .fhead{display:flex;gap:10px;align-items:baseline;
             padding:10px 16px 4px;cursor:pointer}
.frow:hover{background:#f4f2ee}
.frow:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
.frow.cur{background:var(--redbg);border-left-color:var(--red)}
.frow.src{background:#f4e2e2;border-left-color:var(--red)}
.frow.dismissed{color:var(--sub)}
.frow.dismissed .ftitle{color:var(--sub);font-weight:500}
.sev{font-size:10.5px;font-weight:700;letter-spacing:.6px;white-space:nowrap}
.sev-critical{color:var(--red)} .sev-high{color:#a84e00}
.sev-medium{color:var(--amber)} .sev-low,.sev-info{color:var(--sub)}
.fstatus{font-size:11px;color:var(--sub);font-family:var(--mono);
         white-space:nowrap}
.fstatus.verified{color:var(--green)} .fstatus.dismissed{color:var(--faint)}
.ftitle{font-weight:600;flex:1;min-width:0}
.floc{font-family:var(--mono);font-size:11.5px;color:var(--sub);
      white-space:nowrap}
.fmeta{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 4px}
.chip{font-family:var(--mono);font-size:10.5px;color:var(--sub);
      border:1px solid var(--line);border-radius:2px;padding:0 5px}
.fwrite{padding:0 16px 4px;color:var(--sub);display:-webkit-box;
        -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fverdict{padding:0 16px 4px;color:var(--sub);font-size:12px}
.frepro{padding:0 16px 10px;font-family:var(--mono);font-size:11.5px;
        color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frepro .rk{color:var(--sub);font-family:var(--sans)}

/* ── case file ────────────────────────────────── */
.case{display:grid;grid-template-columns:1.05fr 1fr 1.25fr;margin:4px 0 0;
      border-top:1px solid var(--line);background:#fdfcfa}
.case>div{padding:12px 14px;min-width:0}
.case>div+div{border-left:1px solid var(--line)}
.case h4{margin:0 0 8px;font-size:10.5px;letter-spacing:1.1px;
         color:var(--sub);font-weight:600}
.kv{display:grid;grid-template-columns:92px 1fr;gap:2px 8px;font-size:12px}
.kv .k{color:var(--sub)}
.kv .v{min-width:0;overflow-wrap:anywhere}
.kv .v.m{font-family:var(--mono);font-size:11.5px}
.narr{font-size:12.5px;color:var(--ink);margin-bottom:10px;
      white-space:pre-wrap;overflow-wrap:anywhere}
.steps{list-style:none;margin:0;padding:0;counter-reset:st}
.steps li{position:relative;padding:2px 0 2px 34px;font-size:12px;
          overflow-wrap:anywhere;counter-increment:st}
.steps li::before{content:counter(st,decimal-leading-zero);
                  position:absolute;left:0;top:3px;font-family:var(--mono);
                  font-size:10.5px;color:var(--red);font-weight:600}
.steps li+li{border-top:1px solid var(--line2)}
.pocf{border:1px solid var(--line);border-radius:2px;margin-bottom:8px;
      padding:6px 8px;background:var(--bg)}
.pocf .pn{font-family:var(--mono);font-size:11.5px;font-weight:600}
.pocf .ps{font-family:var(--mono);font-size:10.5px;color:var(--sub)}
.pocf pre{margin:6px 0 0;font-family:var(--mono);font-size:11px;
          white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink);
          max-height:52px;overflow:hidden}
.pocf.open pre{max-height:none}
.pocf .tools{margin-top:6px;display:flex;gap:12px}
.tbtn{font-size:11px;color:var(--sub);text-decoration:underline}
.tbtn:hover{color:var(--ink)}
.tbtn:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.atl{list-style:none;margin:0;padding:0}
.atl li{display:grid;grid-template-columns:56px 60px 1fr;gap:8px;
        font-size:11.5px;padding:2px 0;border-top:1px solid var(--line2)}
.atl .ts{font-family:var(--mono);font-size:10.5px;color:var(--sub)}
.muted{color:var(--faint);font-size:12px}
.chainf{margin-top:10px}
.chainf .cid{font-family:var(--mono);font-size:11px;color:var(--sub);
             text-decoration:underline;cursor:pointer}
.chainf .cid:hover{color:var(--red)}

.empty{padding:24px 16px;color:var(--sub)}
.sk{padding:6px 12px}
.sk i{display:block;height:11px;background:#eceae5;border-radius:2px;
      margin:7px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<header id="estate">
  <span class="brand">INDICT</span>
  <span class="live" id="liveInd"><span class="dot">●</span> <span id="liveTxt">IDLE</span></span>
  <span class="stat">repos <b id="cRepos">0</b></span>
  <span class="stat">verified <b id="cVer">0</b></span>
  <span class="stat">dismissed <b id="cDis">0</b></span>
  <span class="stat">alerts <b id="cAl">0</b></span>
  <span class="stat" id="curRepoLab"></span>
  <span id="stale" role="status"></span>
  <span class="sp"></span>
  <span class="scan" id="scanTs"></span>
</header>

<main id="grid">
  <section id="pipeline" aria-label="Pipeline event ledger">
    <div class="zhead">PIPELINE</div>
    <div id="pipeRows"></div>
  </section>
  <section id="findings" aria-label="Findings">
    <div id="repolabels" role="tablist" aria-label="Repositories"></div>
    <div class="funnel" id="funnel" aria-label="Triage funnel"></div>
    <div id="frows"></div>
  </section>
  <aside id="monitor" aria-label="Monitor">
    <div class="zhead">WATCH</div>
    <div id="watchRows"></div>
    <div class="zhead">ALERTS</div>
    <div id="alertRows"></div>
    <div class="zhead">FIX LOOP</div>
    <div id="fixRows"></div>
  </aside>
</main>
<div class="sr" aria-live="polite" id="ann"></div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const hms=ts=>{if(!ts)return"——:——:——";const d=new Date(ts*1000);
  return pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());};
const ago=ts=>{if(!ts)return"—";const s=Math.max(0,Date.now()/1000-ts);
  if(s<60)return Math.floor(s)+"s ago";if(s<3600)return Math.floor(s/60)+"m ago";
  if(s<86400)return Math.floor(s/3600)+"h ago";return Math.floor(s/86400)+"d ago";};

const SEV={critical:0,high:1,medium:2,low:3,info:4};
const STR={verified:0,adjudicated:1,candidate:2,dismissed:3};
const fidMatch=(a,b)=>!!a&&!!b&&(a===b||a.startsWith(b)||b.startsWith(a));
const evKey=e=>(e.ts||0)+"|"+(e.stage||"")+"|"+(e.msg||"");
const alKey=a=>(a.ts||0)+"|"+(a.channel||"")+"|"+(a.text||"");
const fxKey=x=>x.repo+"|"+x.id;

let DATA=null,lastOk=null,fails=0,curRepo=null;
let cursor={fid:"",keys:[]};
let openCase=null,caseCache={},caseAt={};
let evSeen=0,lastAnn=0,lastEvTotal=null;

const repo=()=>DATA&&(DATA.repos.find(r=>r.name===curRepo)||DATA.repos[0]);
const allAlerts=()=>DATA?DATA.repos.flatMap(r=>r.alerts||[]):[];
const allFixes=()=>DATA?DATA.repos.flatMap(r=>r.fixes||[]):[];

/* skeleton until first poll lands */
function skeleton(el,n,w){
  el.innerHTML=Array.from({length:n},()=>
    '<div class="sk" style="display:grid;grid-template-columns:56px 1fr;gap:8px">'+
    `<i style="width:${w}%"></i><i></i></div>`).join("");
}
skeleton($("#pipeRows"),14,60);skeleton($("#alertRows"),6,40);
skeleton($("#fixRows"),4,40);skeleton($("#watchRows"),3,70);

function saveScroll(){
  return {p:$("#pipeline").scrollTop,f:$("#findings").scrollTop,
          m:$("#monitor").scrollTop,
          stick:$("#pipeline").scrollHeight-$("#pipeline").scrollTop
                -$("#pipeline").clientHeight<48};
}
function restoreScroll(s){
  $("#pipeline").scrollTop=s.stick?$("#pipeline").scrollHeight:s.p;
  $("#findings").scrollTop=s.f;$("#monitor").scrollTop=s.m;
}

function renderEstate(){
  const e=DATA.estate,r=repo();
  $("#cRepos").textContent=e.repos;$("#cVer").textContent=e.verified;
  $("#cDis").textContent=e.dismissed;$("#cAl").textContent=e.alerts;
  const evTot=DATA.repos.reduce((n,r)=>n+(r.events||[]).length,0);
  const arriving=lastEvTotal!==null&&evTot>lastEvTotal;
  lastEvTotal=evTot;
  const on=!!e.live||arriving;
  $("#liveInd").classList.toggle("on",on);
  $("#liveTxt").textContent=on?"LIVE":"IDLE";
  $("#curRepoLab").textContent=r?r.name:"";
  $("#scanTs").textContent="scan "+hms(DATA.generatedAt);
  $("#stale").style.display="none";
}

function renderRepos(){
  const el=$("#repolabels");
  el.innerHTML=DATA.repos.map(r=>
    `<button class="rl${r.name===(repo()||{}).name?" on":""}" role="tab"
      aria-selected="${r.name===(repo()||{}).name}" data-repo="${esc(r.name)}"
      >${esc(r.name)}</button>`).join("");
}

function renderFunnel(){
  const r=repo(),el=$("#funnel");
  if(!r){el.innerHTML="";el.dataset.repo="";return}
  const c=r.funnel.candidate||0,kept=(r.funnel.adjudicated||0)+(r.funnel.verified||0),
        v=r.funnel.verified||0,d=r.funnel.dismissed||0;
  const tot=Math.max(c+kept+v,1);
  if(el.dataset.repo!==r.name){
    el.dataset.repo=r.name;
    el.innerHTML=
     `<div class="fseg f-cand"><div class="bar"></div>
        <div class="lab"><b></b> candidates</div></div>
      <span class="farrow">→</span>
      <div class="fseg f-kept"><div class="bar"></div>
        <div class="lab"><b></b> kept</div></div>
      <span class="farrow">→</span>
      <div class="fseg f-ver"><div class="bar"></div>
        <div class="lab"><b></b> verified</div></div>
      <span class="fdis"></span>`;
  }
  const segs=el.querySelectorAll(".fseg");
  [[c,0],[kept,1],[v,2]].forEach(([n,i])=>{
    segs[i].style.width=(n/tot*100)+"%";
    const b=segs[i].querySelector("b");
    if(b.textContent!==String(n)){b.textContent=n;
      b.style.color="var(--red)";setTimeout(()=>b.style.color="",220);}
  });
  el.querySelector(".fdis").textContent=`${d} dismissed · ${r.queue} queued`;
}

function renderPipeline(){
  const r=repo(),el=$("#pipeRows");
  const evs=(r&&r.events)||[];
  if(!evs.length){el.innerHTML='<div class="empty">No events yet.</div>';return}
  el.innerHTML=evs.map(e=>
    `<div class="row${e.level==="kill"?" kill":""}" tabindex="0"
       data-k="${esc(evKey(e))}" data-fid="${esc(e.finding||"")}">
      <div class="cols"><span class="ts">${hms(e.ts)}</span>
      <span class="stage">${esc(e.stage||"")}</span>
      <span class="tail" title="${esc(e.msg||"")}">${esc(e.msg||"")}</span></div>
    </div>`).join("");
  if(evs.length>evSeen){
    const n=evs.length-evSeen,now=Date.now();
    if(evSeen&&now-lastAnn>4000){
      $("#ann").textContent=`${n} new pipeline event${n>1?"s":""} in ${r.name}`;
      lastAnn=now;
    }
    evSeen=evs.length;
  }
}

function sortedFindings(r){
  return (r.findings||[]).map((f,i)=>[f,i]).sort((a,b)=>{
    const s=(SEV[a[0].severity]??5)-(SEV[b[0].severity]??5);
    if(s)return s;
    const t=(STR[a[0].status]??4)-(STR[b[0].status]??4);
    return t||b[1]-a[1];                     // recency: later rows are newer
  }).map(x=>x[0]);
}

function renderFindings(){
  const r=repo(),el=$("#frows");
  if(!r){el.innerHTML='<div class="empty">No repositories under findings root.</div>';return}
  const rows=sortedFindings(r);
  if(!rows.length){
    el.innerHTML='<div class="empty">No findings recorded for this repository. '+
                 'Waiting for the next scan event.</div>';return;
  }
  el.innerHTML=rows.map(f=>{
    const dis=f.status==="dismissed";
    return `<div class="frow${dis?" dismissed":""}" tabindex="0" role="button"
       aria-expanded="${openCase===f.id}" data-fid="${esc(f.id)}"
       data-k="f:${esc(f.id)}" data-id="${esc(f.id)}">
      <div class="fhead">
        <span class="sev sev-${esc(f.severity)}">${esc((f.severity||"").toUpperCase())}</span>
        <span class="fstatus ${esc(f.status)}">${esc(f.status)}</span>
        <span class="ftitle">${esc(f.title||"(untitled)")}</span>
        <span class="floc">${esc(f.file)}:${f.line||0}</span>
      </div>
      <div class="fmeta">${[f.vuln_class,...(f.tags||[])].filter(Boolean)
        .map(t=>`<span class="chip">${esc(t)}</span>`).join("")}
        <span class="chip">conf ${Number(f.confidence||0).toFixed(2)}</span></div>
      ${f.writeup?`<div class="fwrite" title="${esc(f.writeup)}">${esc(f.writeup)}</div>`:""}
      ${dis&&f.verdict?`<div class="fverdict" title="${esc(f.verdict)}">disproof: ${esc(f.verdict)}</div>`:""}
      ${f.reproduce?`<div class="frepro" title="${esc(f.reproduce)}"><span class="rk">Reproduce:</span> ${esc(f.reproduce)}</div>`:""}
      ${openCase===f.id?'<div class="case" data-case></div>':""}
    </div>`;
  }).join("");
  if(openCase) fillCase(r);
}

function stepsFrom(detail){
  const out=[];
  for(const line of String(detail||"").split("\n")){
    const t=line.trim();if(!t)continue;
    if(t.includes("->"))
      t.split(/->+/).map(s=>s.trim()).filter(Boolean).forEach(s=>out.push(s));
    else out.push(t);
  }
  return out;
}

function fillCase(r){
  const box=$(`[data-case]`);if(!box)return;
  const k=r.name+":"+openCase,c=caseCache[k];
  if(!c||caseAt[k]!==DATA.generatedAt){
    box.innerHTML='<div class="muted">Loading case file…</div>';
    fetch(`/api/finding?repo=${encodeURIComponent(r.name)}&id=${encodeURIComponent(openCase)}`)
      .then(x=>x.ok?x.json():null).then(j=>{if(j){caseCache[k]=j;caseAt[k]=DATA.generatedAt;
        if(openCase===k.split(":")[1])renderFindings();}})
      .catch(()=>{box.innerHTML='<div class="muted">Case file unavailable.</div>'});
    if(!c)return;
  }
  const d=c||caseCache[k];if(!d)return;
  const f=d.finding||{},steps=stepsFrom(f.detail);
  const run=(d.events||[]).map(e=>e.run).filter(Boolean).pop()||"—";
  const col1=`<div><h4>SUMMARY · PROVENANCE</h4>
    ${d.writeup?`<div class="narr">${esc(d.writeup)}</div>`:""}
    <div class="kv">
      <span class="k">repo</span><span class="v m">${esc(r.name)}</span>
      <span class="k">location</span><span class="v m">${esc(f.file)}:${f.line||0}</span>
      <span class="k">class</span><span class="v m">${esc(f.vuln_class||"—")}</span>
      <span class="k">severity</span><span class="v">${esc(f.severity||"—")}</span>
      <span class="k">status</span><span class="v">${esc(f.status||"—")}</span>
      <span class="k">engine</span><span class="v m">${esc(f.engine||"—")}</span>
      <span class="k">model</span><span class="v m">${esc(f.model||"—")}</span>
      <span class="k">run</span><span class="v m">${esc(run)}</span>
      <span class="k">confidence</span><span class="v m">${Number(f.confidence||0).toFixed(2)}</span>
      <span class="k">verdict</span><span class="v">${esc(f.verdict||"no verdict recorded")}</span>
    </div>
    ${(d.chain||[]).length?`<div class="chainf"><h4>REFERENCED BY</h4>${
      d.chain.map(o=>`<div><button class="cid" data-chain="${esc(o.id)}"
        title="${esc(o.title)}">${esc(o.id)}</button> <span class="muted">${esc((o.title||"").slice(0,60))}</span></div>`).join("")}</div>`:""}
  </div>`;
  const col2=`<div><h4>EVIDENCE CHAIN (from detail)</h4>
    ${steps.length?`<ol class="steps">${steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>`
      :'<div class="muted">No evidence recorded.</div>'}</div>`;
  const pocs=d.poc||[];
  const col3=`<div><h4>ARTIFACTS</h4>
    ${pocs.length?pocs.map((p,i)=>`<div class="pocf" data-pi="${i}">
      <div><span class="pn">${esc(p.name)}</span> <span class="ps">${p.size}b</span></div>
      ${p.head?`<pre>${esc(p.head)}</pre>
      <div class="tools"><button class="tbtn" data-expand>expand</button>
      <button class="tbtn" data-copy="${i}">copy</button></div>`:""}
    </div>`).join(""):'<div class="muted">No PoC artifacts recorded.</div>'}
    ${f.reproduce?`<div class="frepro" style="padding:8px 0" title="${esc(f.reproduce)}"><span class="rk">Reproduce:</span> ${esc(f.reproduce)}</div>`:""}
    ${(d.alerts||[]).length?`<h4 style="margin-top:10px">ALERT TIMELINE</h4>
      <ul class="atl">${d.alerts.map(a=>`<li><span class="ts">${hms(a.ts)}</span>
        <span class="chan">${esc(a.channel)}${a.sim?"·sim":""}</span>
        <span class="tail" title="${esc(a.text)}">${esc(a.kind||a.text)}</span></li>`).join("")}</ul>`:""}
    ${d.fix?`<h4 style="margin-top:10px">FIX VERDICT</h4>
      <div class="kv"><span class="k">verdict</span>
      <span class="v m ${d.fix.verdict==="fix-verified"?"vd ok":"vd bad"}">${esc(d.fix.verdict||"—")}</span>
      <span class="k">backend</span><span class="v m">${esc(d.fix.backend||"—")}</span>
      <span class="k">ts</span><span class="v m">${hms(d.fix.ts)}</span>
      <span class="k">reason</span><span class="v">${esc(d.fix.reason||"")}</span></div>`:""}
  </div>`;
  box.innerHTML=col1+col2+col3;
  box._poc=pocs;
}

function renderWatch(){
  $("#watchRows").innerHTML=DATA.repos.map(r=>{
    const lv=r.live||{},on=!!lv.live;
    return `<div class="wrow">
      <span class="wname">${esc(r.name)}</span>
      <span class="wmeta">${esc((r.lastSha||"").slice(0,8)||"—")} · ${ago(r.lastScan)}</span>
      <span class="wsub"><span class="wdot${on?" on":""}">●</span>
        <span>${on?"live":"idle"}${lv.done?" · done":""}${lv.stage?" · "+esc(lv.stage):""}</span>
        <span style="margin-left:auto">q ${r.queue}</span></span>
    </div>`;
  }).join("")||'<div class="empty">No repos watched.</div>';
}

function renderAlerts(){
  const rows=allAlerts().slice().sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,150);
  $("#alertRows").innerHTML=rows.map(a=>
    `<div class="row" tabindex="0" data-k="${esc(alKey(a))}" data-fid="${esc(a.id||"")}">
      <div class="cols"><span class="ts">${hms(a.ts)}</span>
      <span class="chan">${esc(a.channel||"?")}${a.sim?"·sim":""}</span>
      <span class="tail" title="${esc(a.text)}">${esc(a.kind&&a.kind!=="outbox"?a.kind+": ":"")}${esc(a.text)}</span></div>
    </div>`).join("")||'<div class="empty">No alerts.</div>';
}

function renderFixes(){
  const rows=allFixes().slice().sort((a,b)=>(b.ts||0)-(a.ts||0));
  $("#fixRows").innerHTML=rows.map(x=>
    `<div class="row" tabindex="0" data-k="${esc(fxKey(x))}" data-fid="${esc(x.id)}">
      <div class="cols"><span class="ts">${hms(x.ts)}</span>
      <span class="vd ${x.verdict==="fix-verified"?"ok":"bad"}" title="${esc(x.repo)} · ${esc(x.id)}">${esc(x.verdict||"—")}</span>
      <span class="tail" title="${esc(x.repo)} ${esc(x.id)} — ${esc(x.reason)}">${esc(x.reason)}</span></div>
    </div>`).join("")||'<div class="empty">No fix runs.</div>';
}

function applyCursor(){
  document.querySelectorAll(".cur,.src").forEach(el=>el.classList.remove("cur","src"));
  const fid=cursor.fid;
  if(fid)document.querySelectorAll("[data-fid]").forEach(el=>{
    if(fidMatch(el.dataset.fid,fid))el.classList.add("cur");
  });
  for(const k of cursor.keys)
    document.querySelectorAll(`[data-k="${CSS.escape(k)}"]`)
      .forEach(el=>el.classList.add("cur","src"));
}

function retarget(fid,keys){
  cursor={fid:fid||"",keys:keys||[]};
  applyCursor();
}

function renderAll(){
  if(!DATA)return;
  const s=saveScroll();
  const ae=document.activeElement;
  const fk=ae&&ae.dataset&&(ae.dataset.k||ae.dataset.id||ae.dataset.repo);
  const fkind=ae&&ae.dataset&&(ae.dataset.k?"k":ae.dataset.id?"id":
                             ae.dataset.repo?"repo":"");
  renderEstate();renderRepos();renderPipeline();renderFunnel();
  renderFindings();renderWatch();renderAlerts();renderFixes();
  applyCursor();restoreScroll(s);
  if(fkind){const sel=fkind==="k"?`[data-k="${CSS.escape(fk)}"]`:
    fkind==="id"?`[data-id="${CSS.escape(fk)}"]`:`[data-repo="${CSS.escape(fk)}"]`;
    const n=document.querySelector(sel);
    if(n)n.focus({preventScroll:true});}
}

async function tick(){
  if(document.hidden)return;
  try{
    const r=await fetch("/api/state",{cache:"no-store"});
    if(!r.ok)throw 0;
    const j=await r.json();
    DATA=j;fails=0;lastOk=Date.now();
    if(!curRepo||!j.repos.some(x=>x.name===curRepo))
      curRepo=(j.repos[0]||{}).name||null;
    renderAll();
  }catch(e){
    fails++;
    if(fails>=2){
      const el=$("#stale");
      el.style.display="inline";
      el.textContent="State may be stale · last updated "+
        (lastOk?hms(lastOk/1000):"—");
    }
  }
}
setInterval(tick,2000);tick();

/* ── selection / cursor wiring ────────────────── */
document.addEventListener("click",e=>{
  const rl=e.target.closest("#repolabels .rl");
  if(rl){curRepo=rl.dataset.repo;openCase=null;evSeen=0;
    cursor={fid:"",keys:[]};renderAll();return}
  const cid=e.target.closest("[data-chain]");
  if(cid){retarget(cid.dataset.chain,[]);return}
  const cp=e.target.closest("[data-copy]");
  if(cp){
    const box=cp.closest("[data-case]"),p=(box&&box._poc||[])[+cp.dataset.copy];
    if(p){const t=p.head||"";
      if(navigator.clipboard&&navigator.clipboard.writeText)
        navigator.clipboard.writeText(t).catch(()=>{});
      else{const ta=document.createElement("textarea");ta.value=t;
        document.body.appendChild(ta);ta.select();
        try{document.execCommand("copy")}catch(_){}ta.remove();}}
    return}
  const ex=e.target.closest("[data-expand]");
  if(ex){const pf=ex.closest(".pocf");pf.classList.toggle("open");
    ex.textContent=pf.classList.contains("open")?"collapse":"expand";return}
  if(e.target.closest(".case"))return;   // clicks inside case file don't toggle
  const fr=e.target.closest(".frow");
  if(fr){
    const id=fr.dataset.id;
    openCase=openCase===id?null:id;
    retarget(id,["f:"+id]);
    renderFindings();applyCursor();
    return}
  const row=e.target.closest(".row");
  if(row)retarget(row.dataset.fid||"",[row.dataset.k]);
});

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&openCase){openCase=null;renderFindings();applyCursor();return}
  const row=e.target.closest&&e.target.closest(".row,.frow,#repolabels .rl");
  if(!row)return;
  if(e.key==="Enter"||e.key===" "){e.preventDefault();row.click();return}
  if(e.key!=="ArrowDown"&&e.key!=="ArrowUp")return;
  e.preventDefault();
  const rows=[...row.parentElement.querySelectorAll(".row,.frow,.rl")];
  const nxt=rows[rows.indexOf(row)+(e.key==="ArrowDown"?1:-1)];
  if(nxt)nxt.focus();
});
</script>
</body>
</html>
